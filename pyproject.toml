[project]
name = "kaggle-ai-agent-security"
version = "0.1.0"
description = "AI Agent Security - Multi-Step Tool Attacks (Kaggle) — 攻撃アルゴリズム探索"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # eval ロジック層（全 tier 必須・GPU 不要）
    "gymnasium>=0.29,<1", # 公式採点と同じ gym 環境
    "pydantic>=2",        # SDK が内部で使用

    # eval 実モデル層（GPU/Metal。ロジック層には不要だがローカル統一のため）
    "llama-cpp-python>=0.3", # GGUF 推論（gpt-oss / gemma）
    "huggingface-hub>=0.23", # GGUF 取得（hf_hub_download）

    # 運用（Kaggle CLI）
    "kaggle>=1.6",

    # 研究データ収集（scripts/research: ディスカッション/カーネル収集）
    "requests>=2.31", # 内部 API（discussions）への HTTP。uv.lock に推移解決済み
    "nbformat>=5.10", # build_notebook.py / kernel_read.py が .ipynb を読み書き
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ipykernel>=7",    # ローカルで Notebook を確認する場合
]

[tool.uv]
# アプリケーションリポジトリ（配布パッケージではない）。自身をビルド/インストールしない。
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "I001"]
# attack.py は /kaggle/working/attack.py として単一ファイルでロードされる自己完結スクリプト。
# ベースライン継承の再エクスポート（F401）やトップレベル副作用（E402）を許容する。
# 実績カーネル移植の自己完結スクリプトでは、事前トークン化した長い host bank や日本語注釈の長行（E501）、
# SDK 呼び出しの防御的 try/except（SIM105）も許容する。
"experiments/**/attack.py" = ["E402", "F401", "E501", "SIM105"]
# docs/knowledges/reference/*.py は実績のある attack.py の退避コピー（同じ契約に従う）。
"docs/knowledges/reference/*.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
